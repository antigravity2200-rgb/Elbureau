<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f4d125", // Bright Yellow
                        "background-light": "#f8f8f5", // Cream
                        "background-dark": "#221f10",
                        "ink": "#181711", // Black for outlines
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",

                        "xl": "1.5rem",

                        'hard-xs': '2px 2px 0 0 #181711',

<style>

        }.no-scrollbar::-webkit-scrollbar {

        .no-scrollbar {
            -ms-overflow-style: none;

        }

<span class="material-symbols-outlined text-primary text-[20px] font-bold opacity-0 group-has-[:checked]:opacity-100">check</span>
</div>
</label>
<label class="radio-card group relative flex items-center justify-between p-4 rounded-xl bg-white border-2 border-ink shadow-hard cursor-pointer hover:-translate-y-1 hover:shadow-hard-lg">
<input class="peer sr-only" name="quiz_answer" type="radio" value="black_beans"/>

<div class="flex items-center justify-center w-10 h-10 rounded-lg bg-white text-ink font-black text-lg border-2 border-ink group-hover:bg-primary transition-colors shadow-[2px_2px_0_0_#181711]">C</div>

</div>
</label>

<input class="peer sr-only" name="quiz_answer" type="radio" value="peas"/>
