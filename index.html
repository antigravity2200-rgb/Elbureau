<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ElBureau</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ElBureau" />

  <style>
    html,
    body,
    #root {
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      min-height: max(884px, 100dvh);
      /* Simple dot grid fallback */
      background-image: radial-gradient(#181711 0.5px, transparent 0.5px);
      background-size: 24px 24px;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Specific text stroke utility if needed */
    .text-stroke {
      -webkit-text-stroke: 1.5px black;
    }

    .rotate-random-1 {
      transform: rotate(-1.5deg);
    }

    .rotate-random-2 {
      transform: rotate(2deg);
    }

    .rotate-random-3 {
      transform: rotate(-2deg);
    }

    .rotate-random-4 {
      transform: rotate(1.5deg);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "peerjs": "https://esm.sh/peerjs@1.5.4?bundle-deps"
  }
}
</script>
</head>

<body class="bg-background-light dark:bg-background-dark text-text-main font-display antialiased">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
